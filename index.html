<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xác định vị trí GPS</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background: #f0f2f5;
            text-align: center;
            padding: 20px;
        }
        h2 { color: #1a73e8; margin-bottom: 10px; }
        #status { color: #555; font-size: 16px; line-height: 1.5; }
    </style>
</head>
<body>
    <h2>Đang xác định vị trí GPS của bạn...</h2>
    <p id="status">Vui lòng cho phép trình duyệt truy cập vị trí.</p>

    <script>
        // ========== THÔNG TIN FORM CỦA BẠN ==========
        const FORM_ID = "1FAIpQLSdTUuxeK8RmNjctuQpTdHIBu2aUvyzunEpoo67Bycgl93WQbQ";
        const ENTRY_1 = "entry.346232759";      // Ô thứ nhất
        const ENTRY_GPS = "entry.1243873609";   // Ô chứa tọa độ GPS
        // ============================================

        function getLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(redirectToForm, showError, {
                    enableHighAccuracy: true,
                    timeout: 15000,
                    maximumAge: 0
                });
            } else {
                document.getElementById("status").innerText = "Trình duyệt không hỗ trợ định vị GPS.";
            }
        }

        function redirectToForm(position) {
            const lat = position.coords.latitude;
            const lng = position.coords.longitude;

            // Ghép tọa độ thành chuỗi: "vĩ độ, kinh độ"
            const toaDo = `${lat}, ${lng}`;

            // Tạo link Google Form đã điền sẵn
            // Ở đây mình để ô 1 trống (hoặc bạn có thể điền giá trị cố định), ô 2 là tọa độ GPS
            const formUrl = `https://docs.google.com/forms/d/e/${FORM_ID}/viewform?usp=pp_url&${ENTRY_1}=&${ENTRY_GPS}=${encodeURIComponent(toaDo)}`;

            document.getElementById("status").innerHTML = 
                `Đã lấy tọa độ thành công!<br>
                <strong>${lat.toFixed(6)}, ${lng.toFixed(6)}</strong><br>
                Đang chuyển đến form...`;

            // Chuyển hướng sau 1.2 giây
            setTimeout(() => {
                window.location.href = formUrl;
            }, 1200);
        }

        function showError(error) {
            let message = "";
            switch(error.code) {
                case error.PERMISSION_DENIED:
                    message = "Bạn đã từ chối quyền truy cập vị trí.";
                    break;
                case error.POSITION_UNAVAILABLE:
                    message = "Không thể xác định vị trí hiện tại.";
                    break;
                case error.TIMEOUT:
                    message = "Hết thời gian chờ lấy vị trí. Vui lòng thử lại.";
                    break;
                default:
                    message = "Đã xảy ra lỗi không xác định.";
                    break;
            }
            document.getElementById("status").innerText = message;
        }

        window.onload = getLocation;
    </script>
</body>
</html>
